<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ee">
  <meta name="description" content="도은이를 다정하게 쓰다듬어 포근하게 깨우는 미니게임입니다.">
  <title>도은이의 포근한 기상 미션 | Beflower 게임 놀이터</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bf-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bf-theme", theme);
        document.documentElement.classList.toggle("bf-theme-dark", theme === "dark");
        document.documentElement.classList.toggle("bf-theme-light", theme !== "dark");
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/beflower.css">
  <style>
    :root { --wake-coral: #ef9278; --wake-ink: #493d37; --wake-muted: #897a70; }
    * { box-sizing: border-box; }
    body { min-width: 320px; background: radial-gradient(ellipse at 10% 12%, rgba(255,222,174,.48), transparent 28rem), radial-gradient(ellipse at 90% 80%, rgba(240,204,220,.3), transparent 25rem), var(--bf-bg); color: var(--wake-ink); }
    .wake-shell { width: min(100% - 32px, 760px); margin: 0 auto; padding: 28px 0 34px; }
    .wake-card { overflow: hidden; padding: 34px clamp(18px, 5vw, 46px) 25px; border: 1px solid rgba(230,211,191,.8); border-radius: 30px; background: var(--bf-surface); box-shadow: var(--bf-shadow-md); text-align: center; }
    .wake-intro .eyebrow { margin: 0 0 10px; color: #d5866d; font-size: .76rem; font-weight: 800; letter-spacing: .14em; }
    .wake-intro h1 { margin: 0; color: var(--bf-ink); font-size: clamp(1.8rem,5vw,2.45rem); letter-spacing: -.055em; }
    .wake-subtitle { margin: 10px 0 0; color: var(--bf-sub); font-size: .98rem; }
    .wake-stats { display: flex; justify-content: center; gap: 10px; margin: 24px 0 14px; }
    .wake-stat { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; background: #fff6ec; color: #645348; font-size: .9rem; }
    .wake-stat-icon { color: #db8b71; }
    .wake-stat b { color: #d57961; }
    .wake-scene { position: relative; display: grid; height: 280px; place-items: center; overflow: hidden; border: 1px solid #f3e6d9; border-radius: 24px; background: linear-gradient(180deg,#fff4e6 0%,#fff8f1 62%,#f8e9da 100%); }
    .wake-sun { position: absolute; top: 20px; right: 12%; color: #f2bd66; font-size: 2rem; opacity: .8; }
    .wake-cloud { position: absolute; color: white; filter: drop-shadow(0 3px 4px rgba(188,156,129,.1)); font-size: 2.8rem; }
    .wake-cloud-one { top: 26px; left: 12%; }
    .wake-cloud-two { top: 75px; right: 14%; font-size: 2rem; opacity: .8; }
    .wake-sleep-label { position: absolute; top: 26px; left: 50%; z-index: 3; color: #a18a9a; font-size: .9rem; font-weight: 700; transform: translateX(-50%); transition: color .25s; }
    .wake-bed { position: absolute; right: 8%; bottom: 28px; left: 8%; height: 68px; border: 4px solid #e7bfa9; border-top: 0; border-radius: 0 0 23px 23px; background: #f5d6c3; }
    .wake-bed::before { position: absolute; top: -18px; right: -5px; left: -5px; height: 28px; border-radius: 15px; background: #f0cbb6; content: ""; }
    .wake-student { position: absolute; z-index: 2; top: 76px; left: 50%; width: 162px; height: 174px; padding: 0; border: 0; background: transparent; cursor: pointer; transform: translateX(-50%); transition: filter .2s ease; -webkit-tap-highlight-color: transparent; }
    .wake-student:not(:disabled):hover { filter: drop-shadow(0 8px 9px rgba(194,131,109,.19)); }
    .wake-student:focus-visible { outline: 3px solid #d88c72; outline-offset: 7px; border-radius: 40%; }
    .wake-student:disabled { cursor: default; }
    .wake-hair { position: absolute; z-index: 2; top: 15px; left: 31px; width: 100px; height: 94px; border-radius: 48% 48% 43% 43%; background: #66504a; }
    .wake-hair::before, .wake-hair::after { position: absolute; top: 3px; width: 39px; height: 42px; border-radius: 50%; background: #66504a; content: ""; }
    .wake-hair::before { left: -4px; transform: rotate(-24deg); }
    .wake-hair::after { right: -3px; transform: rotate(22deg); }
    .wake-face { position: absolute; z-index: 3; top: 35px; left: 44px; width: 75px; height: 82px; border-radius: 44% 44% 48% 48%; background: #ffdfc8; transition: transform .25s; }
    .wake-eye { position: absolute; top: 38px; width: 7px; height: 3px; border-radius: 50%; background: #73564d; transition: all .2s; }
    .wake-eye-left { left: 19px; }
    .wake-eye-right { right: 19px; }
    .wake-cheek { position: absolute; top: 48px; width: 13px; height: 7px; border-radius: 50%; background: #f4a69a; opacity: .7; }
    .wake-cheek-left { left: 7px; }
    .wake-cheek-right { right: 7px; }
    .wake-mouth { position: absolute; bottom: 15px; left: 34px; width: 8px; height: 5px; border-bottom: 2px solid #b66f69; border-radius: 50%; }
    .wake-pajama { position: absolute; z-index: 1; bottom: -7px; left: 24px; width: 116px; height: 78px; border: 5px solid #fff9f4; border-radius: 48% 48% 27px 27px; background: #a8c4c0; }
    .wake-student.awake .wake-face { transform: translateY(-2px); }
    .wake-student.awake .wake-eye { top: 35px; height: 8px; border-radius: 50%; }
    .wake-student.pat { animation: gentle-pat .28s ease; }
    .wake-sparkles { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .wake-sparkle { position: absolute; color: #efad62; font-size: 20px; animation: sparkle-up .75s ease-out forwards; }
    .wake-meter { margin: 20px 2px 0; text-align: left; }
    .wake-meter-heading { display: flex; justify-content: space-between; margin-bottom: 9px; color: #67574c; font-size: .83rem; font-weight: 700; }
    .wake-meter-heading span:last-child { color: #bc8974; }
    .wake-meter-track { height: 13px; overflow: hidden; border-radius: 999px; background: #f5eee7; }
    .wake-meter-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#f8c87e,#f18d76); transition: width .3s ease; }
    .wake-message { min-height: 24px; margin: 17px 0 14px; color: var(--bf-sub); font-size: .9rem; }
    .wake-start { min-width: 220px; padding: 14px 24px; border: 0; border-radius: 16px; background: var(--wake-coral); box-shadow: 0 8px 18px rgba(221,130,105,.24); color: white; font-size: 1rem; font-weight: 800; cursor: pointer; transition: transform .15s,background .15s; }
    .wake-start:hover { background: #e68168; transform: translateY(-2px); }
    .wake-start:active { transform: translateY(1px); }
    .wake-start:focus-visible { outline: 3px solid #8e5e4d; outline-offset: 3px; }
    .wake-note { margin: 16px 0 0; color: #a18f82; font-size: .78rem; }
    @keyframes gentle-pat { 0%,100% { transform: translateX(-50%) translateY(0) rotate(0); } 45% { transform: translateX(-50%) translateY(5px) rotate(2deg); } 75% { transform: translateX(-50%) translateY(-2px) rotate(-1deg); } }
    @keyframes sparkle-up { from { opacity: 1; transform: translateY(0) scale(.7) rotate(0); } to { opacity: 0; transform: translateY(-40px) scale(1.2) rotate(28deg); } }
    @media (max-width: 520px) {
      .wake-shell { width: min(100% - 22px,760px); padding-top: 20px; }
      .wake-card { padding: 27px 15px 22px; border-radius: 24px; }
      .wake-scene { height: 255px; }
      .wake-student { top: 68px; transform: translateX(-50%) scale(.91); }
      .wake-student.pat { animation-name: gentle-pat-mobile; }
      .wake-bed { bottom: 20px; }
      .wake-stats { margin-top: 20px; }
      @keyframes gentle-pat-mobile { 0%,100% { transform: translateX(-50%) scale(.91) translateY(0); } 45% { transform: translateX(-50%) scale(.91) translateY(5px) rotate(2deg); } 75% { transform: translateX(-50%) scale(.91) translateY(-2px) rotate(-1deg); } }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="bf-topbar">
    <div class="bf-topbar-inner">
      <a class="bf-brand" href="../../index.html">
        <span class="bf-brand-logo" aria-hidden="true">🌸</span>
        <span class="bf-brand-text"><span class="bf-brand-title">Beflower의 과학 시뮬레이션 랩</span><span class="bf-brand-sub">게임 놀이터 · 도은이의 기상 미션</span></span>
      </a>
      <nav class="bf-nav" aria-label="주요 메뉴">
        <a href="../../index.html">🏠 홈</a>
        <a href="../../index.html#sims">🧪 시뮬레이션</a>
        <a href="../../index.html#coding">💻 프로그램 수업</a>
        <a class="active" href="../../index.html#games">🎮 게임</a>
      </nav>
    </div>
  </header>

  <main class="wake-shell">
    <section class="wake-card" aria-labelledby="gameTitle">
      <header class="wake-intro">
        <p class="eyebrow">오늘의 작은 미션</p>
        <h1 id="gameTitle">도은이의 기상 시간!</h1>
        <p class="wake-subtitle">머리를 살살 쓰다듬어 포근하게 깨워 주세요.</p>
      </header>
      <div class="wake-stats" aria-label="게임 현황">
        <div class="wake-stat"><span class="wake-stat-icon" aria-hidden="true">⏱</span><span id="timer">30초</span></div>
        <div class="wake-stat"><span class="wake-stat-icon" aria-hidden="true">♡</span><span><b id="patCount">0</b>번 쓰담</span></div>
      </div>
      <div class="wake-scene">
        <span class="wake-sun" aria-hidden="true">☀</span>
        <span class="wake-cloud wake-cloud-one" aria-hidden="true">☁</span>
        <span class="wake-cloud wake-cloud-two" aria-hidden="true">☁</span>
        <div class="wake-sleep-label" id="sleepLabel" aria-live="polite">새근새근…</div>
        <div class="wake-bed" aria-hidden="true"></div>
        <button class="wake-student" id="patButton" type="button" aria-label="도은이 머리를 살살 쓰다듬기" disabled>
          <span class="wake-hair" aria-hidden="true"></span>
          <span class="wake-face" aria-hidden="true"><span class="wake-eye wake-eye-left"></span><span class="wake-eye wake-eye-right"></span><span class="wake-cheek wake-cheek-left"></span><span class="wake-cheek wake-cheek-right"></span><span class="wake-mouth"></span></span>
          <span class="wake-pajama" aria-hidden="true"></span>
        </button>
        <div class="wake-sparkles" id="sparkles" aria-hidden="true"></div>
      </div>
      <section class="wake-meter" aria-label="기상 게이지">
        <div class="wake-meter-heading"><span>기상 게이지</span><span id="meterText">아직 졸려요</span></div>
        <div class="wake-meter-track" id="meterBar" role="progressbar" aria-label="기상 정도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="wake-meter-fill" id="meterFill"></div></div>
      </section>
      <p class="wake-message" id="message" aria-live="polite">시작을 누른 뒤, 얼굴을 톡톡 눌러 살살 깨워 보세요.</p>
      <button class="wake-start" id="startButton" type="button">미션 시작하기 <span aria-hidden="true">→</span></button>
      <p class="wake-note">천천히, 다정하게 깨우는 게 오늘의 규칙이에요 ✨</p>
    </section>
  </main>

  <footer class="bf-footer">
    <div class="bf-footer-inner">
      <div class="bf-footer-links"><a href="../../index.html">🏠 홈으로</a><a href="../../index.html#sims">🧪 과학 시뮬레이션</a><a href="../../index.html#coding">💻 프로그램 수업</a><a href="../../index.html#games">🎮 게임 놀이터</a></div>
      <div>© <span id="year"></span> Beflower · 즐겁게 배우고 신나게 놀아요!</div>
    </div>
  </footer>
  <script>
    (() => {
      const startButton = document.getElementById("startButton");
      const patButton = document.getElementById("patButton");
      const student = document.querySelector(".wake-student");
      const timerElement = document.getElementById("timer");
      const patCountElement = document.getElementById("patCount");
      const meterBar = document.getElementById("meterBar");
      const meterFill = document.getElementById("meterFill");
      const meterText = document.getElementById("meterText");
      const message = document.getElementById("message");
      const sleepLabel = document.getElementById("sleepLabel");
      const sparkles = document.getElementById("sparkles");
      const roundSeconds = 30;
      const wakePerPat = 13;
      let wakeProgress = 0;
      let pats = 0;
      let secondsLeft = roundSeconds;
      let timerId = null;
      let gameActive = false;

      document.getElementById("year").textContent = String(new Date().getFullYear());
      function renderProgress() {
        const progress = Math.min(wakeProgress, 100);
        meterFill.style.width = `${progress}%`;
        meterBar.setAttribute("aria-valuenow", String(progress));
        patCountElement.textContent = String(pats);
        meterText.textContent = progress >= 100 ? "기상 완료!" : progress >= 65 ? "거의 다 깼어요" : progress >= 30 ? "조금씩 눈을 떠요" : "아직 졸려요";
      }
      function showSparkle() {
        const sparkle = document.createElement("span");
        sparkle.className = "wake-sparkle";
        sparkle.textContent = ["✦", "♡", "✧"][Math.floor(Math.random() * 3)];
        sparkle.style.left = `${42 + Math.random() * 18}%`;
        sparkle.style.top = `${28 + Math.random() * 20}%`;
        sparkles.append(sparkle);
        sparkle.addEventListener("animationend", () => sparkle.remove(), { once: true });
      }
      function finishGame(wokeUp) {
        gameActive = false;
        window.clearInterval(timerId);
        timerId = null;
        patButton.disabled = true;
        student.classList.toggle("awake", wokeUp);
        sleepLabel.textContent = wokeUp ? "좋은 아침!" : "조금만 더 잘래요";
        sleepLabel.style.color = wokeUp ? "#d17b62" : "";
        message.textContent = wokeUp ? `성공! ${pats}번의 다정한 쓰담으로 도은이가 일어났어요 ☀` : "시간이 다 됐어요. 괜찮아요, 다시 포근하게 도전해 봐요!";
        startButton.innerHTML = `${wokeUp ? "한 번 더 하기" : "다시 도전하기"} <span aria-hidden="true">↻</span>`;
        startButton.hidden = false;
      }
      function startGame() {
        window.clearInterval(timerId);
        wakeProgress = 0;
        pats = 0;
        secondsLeft = roundSeconds;
        gameActive = true;
        student.classList.remove("awake", "pat");
        sleepLabel.textContent = "새근새근…";
        sleepLabel.style.color = "";
        message.textContent = "얼굴을 톡톡 눌러 살살 쓰다듬어 주세요.";
        timerElement.textContent = `${secondsLeft}초`;
        startButton.hidden = true;
        patButton.disabled = false;
        renderProgress();
        timerId = window.setInterval(() => {
          secondsLeft -= 1;
          timerElement.textContent = `${secondsLeft}초`;
          if (secondsLeft <= 0) finishGame(false);
        }, 1000);
      }
      function patGently() {
        if (!gameActive) return;
        pats += 1;
        wakeProgress = Math.min(100, wakeProgress + wakePerPat);
        renderProgress();
        student.classList.remove("pat");
        void student.offsetWidth;
        student.classList.add("pat");
        showSparkle();
        if (wakeProgress >= 100) finishGame(true);
        else if (wakeProgress >= 65) message.textContent = "눈을 뜨기 시작했어요! 조금만 더 다정하게 톡톡.";
        else if (wakeProgress >= 30) message.textContent = "도은이가 기지개를 켜요. 부드럽게 한 번 더!";
      }
      startButton.addEventListener("click", startGame);
      patButton.addEventListener("click", patGently);
      renderProgress();

      const themeToggle = document.getElementById("themeToggle");
      if (themeToggle) themeToggle.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-bf-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-bf-theme", next);
        document.documentElement.classList.toggle("bf-theme-dark", next === "dark");
        document.documentElement.classList.toggle("bf-theme-light", next !== "dark");
        try { localStorage.setItem("bf-theme", next); } catch (_) {}
      });
    })();
  </script>
</body>
</html>
